<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미래 명함</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/card.css">
<script src="js/vendor/html2canvas.min.js" defer></script>
<style>
  body { min-height: 100vh; min-height: 100dvh; background: radial-gradient(1200px 600px at 50% -10%, var(--bgc, #dfe7ff), transparent 70%), #eef1f7; }
  .viewer { max-width: 620px; margin: 0 auto; padding: 28px 16px 40px; }
  .v-top { text-align: center; margin-bottom: 18px; }
  .v-top .k { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: #6b7487; }
  .v-top h1 { margin: 4px 0 0; font-size: 22px; }
  .flip { perspective: 1800px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .flip-in { position: relative; width: 100%; aspect-ratio: 9 / 5; transition: transform .75s cubic-bezier(.2,.75,.25,1); transform-style: preserve-3d; }
  .flip.on .flip-in { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face.back { transform: rotateY(180deg); }
  .face .bc-frame { box-shadow: 0 2px 4px rgba(16,24,40,.08), 0 24px 50px rgba(16,24,40,.22); }
  .flip-hint { text-align: center; color: #6b7487; font-size: 14px; margin: 16px 0 6px; }
  .seg { display: flex; justify-content: center; gap: 6px; margin-bottom: 18px; }
  .seg button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 16px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .v-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .v-foot { text-align: center; margin-top: 26px; font-size: 14px; color: #6b7487; }
  .v-foot a { font-weight: 700; color: var(--brand); text-decoration: none; }
  .msg { text-align: center; padding: 40px 22px; }
  .msg .big { font-size: 48px; }
  .owner-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  @keyframes peek { 0%,100% { transform: rotateY(0) } 50% { transform: rotateY(-14deg) } }
  .flip.peek .flip-in { animation: peek 1.1s ease 2; }
  @media (prefers-reduced-motion: reduce) { .flip-in { transition: none; } .flip.peek .flip-in { animation: none; } }
</style>
</head>
<body>
<main class="viewer" id="app">
  <div class="msg" id="loading"><div class="big">🪪</div><p>명함을 불러오는 중…</p></div>
</main>
<script type="module" src="js/view.js"></script>
</body>
</html>
